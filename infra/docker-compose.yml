# Remove the comments to enable the services.
services:
  api-gateway:
    build:
      context: ../api-gateway
    image: api-gateway:latest
    container_name: api-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"

  auth-service:
    build:
      context: ../services/auth-service
    image: auth-service:latest
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "8081:8080"
    depends_on:
      - postgres

