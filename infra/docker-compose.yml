# Campus2Company - Docker Compose
# Database-per-service pattern
# To enable a service: uncomment both the service AND its database together

services:

  # ── API Gateway ────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../api-gateway
    image: api-gateway:latest
    container_name: api-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - auth-service

  # ── Auth Service + Database ────────────────────────────────────
  auth-service:
    build:
      context: ../services/auth-service
    image: auth-service:latest
    container_name: auth-service
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://auth-db:5432/auth_db
    ports:
      - "8081:8080"
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

