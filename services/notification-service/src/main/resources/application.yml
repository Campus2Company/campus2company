server:
  port: 8080

spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_SERVICE_DB_URL}
    username: ${NOTIFICATION_SERVICE_DB_USERNAME}
    password: ${NOTIFICATION_SERVICE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.campus2company.common.event

# JWT Configuration (validation only)
jwt:
  secret: ${JWT_SECRET}
  expiry-minutes: ${JWT_EXPIRY_MINUTES}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.campus2company.notification: DEBUG
    org.apache.kafka: INFO
    org.springframework.kafka: INFO
