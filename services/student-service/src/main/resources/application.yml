server:
  port: 8080

spring:
  application:
    name: student-service

  datasource:
    url: ${STUDENT_SERVICE_DB_URL}
    username: ${STUDENT_SERVICE_DB_USERNAME}
    password: ${STUDENT_SERVICE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (validation only — same secret as auth-service)
jwt:
  secret: ${JWT_SECRET}
  expiry-minutes: ${JWT_EXPIRY_MINUTES}

management:
  endpoints:
    web:
      exposure:
        include: health,info