server:
  port: 8080

spring:
  application:
    name: student-service

  datasource:
    url: ${STUDENT_SERVICE_DB_URL}
    username: ${STUDENT_SERVICE_DB_USERNAME}
    password: ${STUDENT_SERVICE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000 # 1 hour in milliseconds

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info