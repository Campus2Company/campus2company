server:
  port: 8080

spring:
  application:
    name: admin-service

  datasource:
    url: ${ADMIN_SERVICE_DB_URL}
    username: ${ADMIN_SERVICE_DB_USERNAME}
    password: ${ADMIN_SERVICE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Same JWT secret as auth-service (validation only)
jwt:
  secret: ${JWT_SECRET}
  expiry-minutes: ${JWT_EXPIRY_MINUTES}

# Base URL for auth-service (Docker: http://auth-service:8080)
campus2company:
  auth:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    com.campus2company.admin: DEBUG
    org.springframework.security: DEBUG
